<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">ALERTA-LINK - Diagrama de Flujo de Analisis de URL</text>

  <!-- Swimlanes -->
  <!-- Usuario Lane -->
  <rect x="50" y="60" width="200" height="800" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10"/>
  <text x="150" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#1976D2" text-anchor="middle">Usuario (App)</text>

  <!-- Backend Lane -->
  <rect x="270" y="60" width="280" height="800" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
  <text x="410" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#388E3C" text-anchor="middle">Backend (FastAPI)</text>

  <!-- ML/Heuristico Lane -->
  <rect x="570" y="60" width="240" height="800" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="10"/>
  <text x="690" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#7B1FA2" text-anchor="middle">Motores de Deteccion</text>

  <!-- APIs Externas Lane -->
  <rect x="830" y="60" width="220" height="800" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="10"/>
  <text x="940" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">APIs Externas</text>

  <!-- Start Node -->
  <circle cx="150" cy="130" r="18" fill="#4CAF50" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="150" cy="130" r="8" fill="#2E7D32"/>

  <!-- Activity 1: Ingresar URL -->
  <g filter="url(#shadow)">
    <rect x="75" y="170" width="150" height="50" rx="25" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="200" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Ingresar/Compartir URL</text>
  </g>
  <line x1="150" y1="148" x2="150" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activity 2: Enviar a API -->
  <g filter="url(#shadow)">
    <rect x="75" y="250" width="150" height="50" rx="25" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="280" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Enviar POST /analyze</text>
  </g>
  <line x1="150" y1="220" x2="150" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activity 3: Validar URL -->
  <g filter="url(#shadow)">
    <rect x="310" y="250" width="200" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="410" y="280" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Validar y Normalizar URL</text>
  </g>
  <line x1="225" y1="275" x2="310" y2="275" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: URL Valida? -->
  <polygon points="410,330 470,370 410,410 350,370" fill="#FFC107" stroke="#FF8F00" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="365" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">URL</text>
  <text x="410" y="378" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">valida?</text>
  <line x1="410" y1="300" x2="410" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- No: Return Error -->
  <g filter="url(#shadow)">
    <rect x="75" y="350" width="150" height="40" rx="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <text x="150" y="375" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Mostrar Error</text>
  </g>
  <line x1="350" y1="370" x2="225" y2="370" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="360" font-family="Arial" font-size="9" fill="#666">No</text>

  <!-- Activity 4: Extraer Features -->
  <g filter="url(#shadow)">
    <rect x="310" y="440" width="200" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="410" y="470" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Extraer 24 Features</text>
  </g>
  <line x1="410" y1="410" x2="410" y2="440" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="425" font-family="Arial" font-size="9" fill="#666">Si</text>

  <!-- Fork Bar -->
  <rect x="390" y="510" width="300" height="8" rx="4" fill="#333"/>
  <line x1="410" y1="490" x2="410" y2="510" stroke="#555" stroke-width="2"/>

  <!-- Parallel Activities -->
  <!-- ML Prediction -->
  <g filter="url(#shadow)">
    <rect x="595" y="540" width="190" height="50" rx="25" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
    <text x="690" y="565" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Prediccion ML</text>
    <text x="690" y="580" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(GradientBoosting)</text>
  </g>
  <line x1="690" y1="518" x2="690" y2="540" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Heuristic Analysis -->
  <g filter="url(#shadow)">
    <rect x="595" y="610" width="190" height="50" rx="25" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
    <text x="690" y="635" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Analisis Heuristico</text>
    <text x="690" y="650" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(16+ Senales)</text>
  </g>
  <line x1="690" y1="590" x2="690" y2="610" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tranco Check -->
  <g filter="url(#shadow)">
    <rect x="855" y="540" width="170" height="45" rx="22" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="940" y="565" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Verificar Tranco</text>
    <text x="940" y="578" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Top 1M)</text>
  </g>
  <line x1="785" y1="565" x2="855" y2="565" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Score 30-70? -->
  <polygon points="410,540 460,575 410,610 360,575" fill="#FFC107" stroke="#FF8F00" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="572" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Score</text>
  <text x="410" y="583" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">30-70?</text>
  <line x1="410" y1="518" x2="410" y2="540" stroke="#555" stroke-width="2"/>

  <!-- VirusTotal Check -->
  <g filter="url(#shadow)">
    <rect x="855" y="605" width="170" height="45" rx="22" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="940" y="630" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Consultar VirusTotal</text>
    <text x="940" y="643" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Threat Intel)</text>
  </g>
  <line x1="460" y1="575" x2="855" y2="627" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="590" font-family="Arial" font-size="9" fill="#666">Si</text>

  <!-- WHOIS Check (Optional) -->
  <g filter="url(#shadow)">
    <rect x="855" y="670" width="170" height="45" rx="22" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="940" y="695" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Verificar WHOIS</text>
    <text x="940" y="708" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Edad dominio)</text>
  </g>
  <line x1="940" y1="650" x2="940" y2="670" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Join Bar -->
  <rect x="390" y="700" width="300" height="8" rx="4" fill="#333"/>
  <line x1="410" y1="610" x2="410" y2="700" stroke="#555" stroke-width="2"/>
  <line x1="690" y1="660" x2="690" y2="700" stroke="#555" stroke-width="2"/>

  <!-- Activity 5: Calcular Score Final -->
  <g filter="url(#shadow)">
    <rect x="310" y="730" width="200" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="410" y="755" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Calcular Score Final</text>
    <text x="410" y="770" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(0-100)</text>
  </g>
  <line x1="410" y1="708" x2="410" y2="730" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activity 6: Clasificar Riesgo -->
  <g filter="url(#shadow)">
    <rect x="310" y="800" width="200" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="410" y="825" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Clasificar Riesgo</text>
    <text x="410" y="840" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(LOW/MEDIUM/HIGH)</text>
  </g>
  <line x1="410" y1="780" x2="410" y2="800" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activity 7: Mostrar Resultado -->
  <g filter="url(#shadow)">
    <rect x="75" y="800" width="150" height="50" rx="25" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="825" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Mostrar Resultado</text>
    <text x="150" y="840" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Semaforo + Senales)</text>
  </g>
  <line x1="310" y1="825" x2="225" y2="825" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End Node -->
  <circle cx="150" cy="880" r="15" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="150" cy="880" r="10" fill="#333"/>
  <line x1="150" y1="850" x2="150" y2="865" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="50" y="55" width="1000" height="25" fill="none"/>

  <!-- Risk Level Indicators -->
  <g transform="translate(600, 800)">
    <rect x="0" y="0" width="80" height="25" rx="5" fill="#4CAF50"/>
    <text x="40" y="17" font-family="Arial" font-size="10" fill="white" text-anchor="middle">LOW 0-30</text>
  </g>
  <g transform="translate(690, 800)">
    <rect x="0" y="0" width="80" height="25" rx="5" fill="#FF9800"/>
    <text x="40" y="17" font-family="Arial" font-size="10" fill="white" text-anchor="middle">MEDIUM 31-70</text>
  </g>
  <g transform="translate(780, 800)">
    <rect x="0" y="0" width="80" height="25" rx="5" fill="#f44336"/>
    <text x="40" y="17" font-family="Arial" font-size="10" fill="white" text-anchor="middle">HIGH 71-100</text>
  </g>
</svg>
