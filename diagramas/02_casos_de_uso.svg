<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">ALERTA-LINK - Diagrama de Casos de Uso</text>

  <!-- System Boundary -->
  <rect x="200" y="60" width="550" height="630" rx="15" fill="none" stroke="#2196F3" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="475" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#2196F3" text-anchor="middle">Sistema ALERTA-LINK</text>

  <!-- Actor: Usuario -->
  <g transform="translate(60, 180)">
    <circle cx="40" cy="25" r="22" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="40" cy="25" r="16" fill="#fff"/>
    <circle cx="35" cy="22" r="2" fill="#333"/>
    <circle cx="45" cy="22" r="2" fill="#333"/>
    <path d="M 33 30 Q 40 36 47 30" stroke="#333" stroke-width="1.5" fill="none"/>
    <line x1="40" y1="47" x2="40" y2="85" stroke="#4CAF50" stroke-width="3"/>
    <line x1="40" y1="60" x2="15" y2="80" stroke="#4CAF50" stroke-width="3"/>
    <line x1="40" y1="60" x2="65" y2="80" stroke="#4CAF50" stroke-width="3"/>
    <line x1="40" y1="85" x2="20" y2="115" stroke="#4CAF50" stroke-width="3"/>
    <line x1="40" y1="85" x2="60" y2="115" stroke="#4CAF50" stroke-width="3"/>
    <text x="40" y="135" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Usuario</text>
    <text x="40" y="150" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(App Movil)</text>
  </g>

  <!-- Actor: Sistema Externo -->
  <g transform="translate(800, 280)">
    <rect x="5" y="10" width="70" height="50" rx="5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="40" y="40" font-family="Arial" font-size="10" fill="white" text-anchor="middle">API</text>
    <text x="40" y="80" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">APIs</text>
    <text x="40" y="95" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Externas</text>
  </g>

  <!-- Actor: Administrador -->
  <g transform="translate(60, 480)">
    <circle cx="40" cy="25" r="22" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
    <circle cx="40" cy="25" r="16" fill="#fff"/>
    <text x="40" y="30" font-family="Arial" font-size="14" fill="#9C27B0" text-anchor="middle">A</text>
    <line x1="40" y1="47" x2="40" y2="85" stroke="#9C27B0" stroke-width="3"/>
    <line x1="40" y1="60" x2="15" y2="80" stroke="#9C27B0" stroke-width="3"/>
    <line x1="40" y1="60" x2="65" y2="80" stroke="#9C27B0" stroke-width="3"/>
    <line x1="40" y1="85" x2="20" y2="115" stroke="#9C27B0" stroke-width="3"/>
    <line x1="40" y1="85" x2="60" y2="115" stroke="#9C27B0" stroke-width="3"/>
    <text x="40" y="135" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Administrador</text>
    <text x="40" y="150" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(Backend)</text>
  </g>

  <!-- Use Cases -->
  <!-- UC1: Analizar URL -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="140" rx="100" ry="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="350" y="135" font-family="Arial" font-size="12" fill="#1976D2" text-anchor="middle">UC1: Analizar URL</text>
    <text x="350" y="150" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">sospechosa</text>
  </g>

  <!-- UC2: Ver Score de Riesgo -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="220" rx="100" ry="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="350" y="215" font-family="Arial" font-size="12" fill="#1976D2" text-anchor="middle">UC2: Ver Score</text>
    <text x="350" y="230" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">de Riesgo (0-100)</text>
  </g>

  <!-- UC3: Ver Senales Detectadas -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="300" rx="100" ry="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="350" y="295" font-family="Arial" font-size="12" fill="#1976D2" text-anchor="middle">UC3: Ver Senales</text>
    <text x="350" y="310" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Detectadas</text>
  </g>

  <!-- UC4: Reportar URL -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="380" rx="100" ry="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="350" y="375" font-family="Arial" font-size="12" fill="#1976D2" text-anchor="middle">UC4: Reportar URL</text>
    <text x="350" y="390" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">sospechosa</text>
  </g>

  <!-- UC5: Ver Historial -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="460" rx="100" ry="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="350" y="455" font-family="Arial" font-size="12" fill="#1976D2" text-anchor="middle">UC5: Ver Historial</text>
    <text x="350" y="470" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">de Analisis</text>
  </g>

  <!-- UC6: Compartir URL desde App -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="140" rx="100" ry="35" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
    <text x="560" y="135" font-family="Arial" font-size="12" fill="#388E3C" text-anchor="middle">UC6: Compartir URL</text>
    <text x="560" y="150" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">desde otra App</text>
  </g>

  <!-- UC7: Verificar Dominio Tranco -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="220" rx="100" ry="35" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="560" y="215" font-family="Arial" font-size="12" fill="#E65100" text-anchor="middle">UC7: Verificar</text>
    <text x="560" y="230" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Dominio (Tranco)</text>
  </g>

  <!-- UC8: Consultar VirusTotal -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="300" rx="100" ry="35" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="560" y="295" font-family="Arial" font-size="12" fill="#E65100" text-anchor="middle">UC8: Consultar</text>
    <text x="560" y="310" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">VirusTotal</text>
  </g>

  <!-- UC9: Verificar WHOIS -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="380" rx="100" ry="35" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="560" y="375" font-family="Arial" font-size="12" fill="#E65100" text-anchor="middle">UC9: Verificar</text>
    <text x="560" y="390" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Edad (WHOIS)</text>
  </g>

  <!-- UC10: Crawlear Pagina -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="460" rx="100" ry="35" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="560" y="455" font-family="Arial" font-size="12" fill="#E65100" text-anchor="middle">UC10: Crawlear</text>
    <text x="560" y="470" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Pagina Web</text>
  </g>

  <!-- UC11: Ingestar URLs -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="560" rx="100" ry="35" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="350" y="555" font-family="Arial" font-size="12" fill="#7B1FA2" text-anchor="middle">UC11: Ingestar URLs</text>
    <text x="350" y="570" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">para entrenamiento</text>
  </g>

  <!-- UC12: Entrenar Modelo -->
  <g filter="url(#shadow)">
    <ellipse cx="560" cy="560" rx="100" ry="35" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="560" y="555" font-family="Arial" font-size="12" fill="#7B1FA2" text-anchor="middle">UC12: Entrenar</text>
    <text x="560" y="570" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Modelo ML</text>
  </g>

  <!-- UC13: Monitorear Sistema -->
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="640" rx="100" ry="35" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="450" y="635" font-family="Arial" font-size="12" fill="#7B1FA2" text-anchor="middle">UC13: Monitorear</text>
    <text x="450" y="650" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Sistema (/health)</text>
  </g>

  <!-- Associations Usuario -->
  <line x1="130" y1="300" x2="250" y2="140" stroke="#4CAF50" stroke-width="1.5"/>
  <line x1="130" y1="300" x2="250" y2="220" stroke="#4CAF50" stroke-width="1.5"/>
  <line x1="130" y1="310" x2="250" y2="300" stroke="#4CAF50" stroke-width="1.5"/>
  <line x1="130" y1="320" x2="250" y2="380" stroke="#4CAF50" stroke-width="1.5"/>
  <line x1="130" y1="330" x2="250" y2="460" stroke="#4CAF50" stroke-width="1.5"/>

  <!-- Association Usuario -> Compartir -->
  <line x1="130" y1="280" x2="460" y2="140" stroke="#4CAF50" stroke-width="1.5"/>

  <!-- Associations Administrador -->
  <line x1="130" y1="580" x2="250" y2="560" stroke="#9C27B0" stroke-width="1.5"/>
  <line x1="130" y1="590" x2="460" y2="560" stroke="#9C27B0" stroke-width="1.5"/>
  <line x1="130" y1="600" x2="350" y2="640" stroke="#9C27B0" stroke-width="1.5"/>

  <!-- Associations APIs Externas -->
  <line x1="800" y1="330" x2="660" y2="220" stroke="#FF9800" stroke-width="1.5"/>
  <line x1="800" y1="340" x2="660" y2="300" stroke="#FF9800" stroke-width="1.5"/>
  <line x1="800" y1="350" x2="660" y2="380" stroke="#FF9800" stroke-width="1.5"/>
  <line x1="800" y1="360" x2="660" y2="460" stroke="#FF9800" stroke-width="1.5"/>

  <!-- Include relationships -->
  <!-- UC1 includes UC7 -->
  <line x1="430" y1="160" x2="480" y2="200" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="445" y="175" font-family="Arial" font-size="8" fill="#666">&lt;&lt;include&gt;&gt;</text>

  <!-- UC1 includes UC8 -->
  <line x1="430" y1="165" x2="480" y2="280" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- UC1 extends UC9 -->
  <line x1="430" y1="170" x2="480" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="420" y="260" font-family="Arial" font-size="8" fill="#999">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC1 extends UC10 -->
  <line x1="430" y1="175" x2="480" y2="440" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="30" y="700" width="840" height="40" rx="5" fill="white" stroke="#ddd"/>
  <text x="50" y="725" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Leyenda:</text>
  <ellipse cx="140" cy="720" rx="25" ry="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="175" y="724" font-family="Arial" font-size="9" fill="#333">Usuario</text>
  <ellipse cx="250" cy="720" rx="25" ry="12" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
  <text x="285" y="724" font-family="Arial" font-size="9" fill="#333">Sistema/API</text>
  <ellipse cx="370" cy="720" rx="25" ry="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="405" y="724" font-family="Arial" font-size="9" fill="#333">Admin</text>
  <line x1="470" y1="720" x2="510" y2="720" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="520" y="724" font-family="Arial" font-size="9" fill="#333">&lt;&lt;include&gt;&gt;</text>
  <line x1="600" y1="720" x2="640" y2="720" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="650" y="724" font-family="Arial" font-size="9" fill="#333">&lt;&lt;extend&gt;&gt;</text>
  <line x1="730" y1="720" x2="770" y2="720" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="780" y="724" font-family="Arial" font-size="9" fill="#333">Asociacion</text>
</svg>
