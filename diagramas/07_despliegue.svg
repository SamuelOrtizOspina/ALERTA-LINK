<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#f5f7fa"/>

  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">ALERTA-LINK - Diagrama de Despliegue</text>

  <!-- Cloud Environment -->
  <g filter="url(#shadow)">
    <path d="M 320 100
             C 280 100, 260 130, 280 160
             C 240 160, 220 200, 260 230
             C 240 260, 280 300, 340 290
             L 760 290
             C 820 300, 860 260, 840 230
             C 880 200, 860 160, 820 160
             C 840 130, 820 100, 780 100
             Z"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="550" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#1976D2" text-anchor="middle">Cloud (Render.com)</text>
  </g>

  <!-- Render Server Node -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="400" height="120" rx="5" fill="url(#serverGrad)"/>
    <!-- 3D effect -->
    <path d="M 350 150 L 365 135 L 765 135 L 750 150 Z" fill="#66BB6A"/>
    <path d="M 750 150 L 765 135 L 765 255 L 750 270 Z" fill="#388E3C"/>

    <text x="550" y="175" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
    <text x="550" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Render Web Service</text>

    <!-- Components inside -->
    <rect x="370" y="210" width="110" height="45" rx="3" fill="white" stroke="#2E7D32" stroke-width="1"/>
    <text x="425" y="230" font-family="Arial" font-size="10" fill="#2E7D32" text-anchor="middle">FastAPI</text>
    <text x="425" y="245" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Python 3.11</text>

    <rect x="495" y="210" width="110" height="45" rx="3" fill="white" stroke="#2E7D32" stroke-width="1"/>
    <text x="550" y="230" font-family="Arial" font-size="10" fill="#2E7D32" text-anchor="middle">Uvicorn</text>
    <text x="550" y="245" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">ASGI Server</text>

    <rect x="620" y="210" width="110" height="45" rx="3" fill="white" stroke="#2E7D32" stroke-width="1"/>
    <text x="675" y="230" font-family="Arial" font-size="10" fill="#2E7D32" text-anchor="middle">ML Models</text>
    <text x="675" y="245" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">sklearn, joblib</text>
  </g>

  <!-- URL Label for API -->
  <rect x="430" y="275" width="240" height="25" rx="12" fill="#1976D2" filter="url(#shadow)"/>
  <text x="550" y="293" font-family="Consolas" font-size="11" fill="white" text-anchor="middle">api.samuelortizospina.me</text>

  <!-- Android Device Node -->
  <g filter="url(#shadow)">
    <rect x="50" y="380" width="200" height="300" rx="20" fill="url(#deviceGrad)"/>
    <!-- Screen -->
    <rect x="65" y="420" width="170" height="220" rx="5" fill="#333"/>
    <rect x="70" y="425" width="160" height="210" rx="3" fill="white"/>

    <text x="150" y="405" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>

    <!-- App Icon -->
    <rect x="90" y="445" width="40" height="40" rx="8" fill="#4CAF50"/>
    <text x="110" y="472" font-family="Arial" font-size="18" fill="white" text-anchor="middle">A</text>
    <text x="145" y="465" font-family="Arial" font-size="9" fill="#333">ALERTA-LINK</text>
    <text x="145" y="478" font-family="Arial" font-size="8" fill="#666">Flutter App</text>

    <!-- App Components -->
    <rect x="80" y="500" width="140" height="25" rx="3" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
    <text x="150" y="517" font-family="Arial" font-size="9" fill="#1976D2" text-anchor="middle">UI Layer (Dart)</text>

    <rect x="80" y="535" width="140" height="25" rx="3" fill="#E8F5E9" stroke="#388E3C" stroke-width="1"/>
    <text x="150" y="552" font-family="Arial" font-size="9" fill="#388E3C" text-anchor="middle">API Service</text>

    <rect x="80" y="570" width="140" height="25" rx="3" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
    <text x="150" y="587" font-family="Arial" font-size="9" fill="#E65100" text-anchor="middle">Local Storage</text>

    <!-- Home Button -->
    <circle cx="150" cy="660" r="15" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

    <text x="150" y="700" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Android Device</text>
    <text x="150" y="715" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Android 8.0+</text>
  </g>

  <!-- External APIs Cloud -->
  <g filter="url(#shadow)">
    <path d="M 800 380
             C 760 380, 740 410, 760 440
             C 720 440, 700 480, 740 510
             C 720 540, 760 580, 820 570
             L 1020 570
             C 1060 580, 1080 540, 1060 510
             C 1100 480, 1080 440, 1040 440
             C 1060 410, 1040 380, 1000 380
             Z"
          fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="920" y="410" font-family="Arial" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">APIs Externas</text>
  </g>

  <!-- External API Nodes -->
  <g>
    <rect x="820" y="430" width="80" height="50" rx="3" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="860" y="455" font-family="Arial" font-size="10" fill="#E65100" text-anchor="middle">Tranco</text>
    <text x="860" y="470" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">API</text>
  </g>

  <g>
    <rect x="920" y="430" width="80" height="50" rx="3" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="960" y="455" font-family="Arial" font-size="10" fill="#E65100" text-anchor="middle">VirusTotal</text>
    <text x="960" y="470" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">API</text>
  </g>

  <g>
    <rect x="820" y="495" width="80" height="50" rx="3" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="860" y="520" font-family="Arial" font-size="10" fill="#E65100" text-anchor="middle">WHOIS</text>
    <text x="860" y="535" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Lookup</text>
  </g>

  <g>
    <rect x="920" y="495" width="80" height="50" rx="3" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="960" y="520" font-family="Arial" font-size="10" fill="#E65100" text-anchor="middle">Chromium</text>
    <text x="960" y="535" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Crawler</text>
  </g>

  <!-- Database Node -->
  <g filter="url(#shadow)">
    <ellipse cx="550" cy="420" rx="80" ry="35" fill="#607D8B"/>
    <rect x="470" y="420" width="160" height="70" fill="#607D8B"/>
    <ellipse cx="550" cy="490" rx="80" ry="35" fill="#455A64"/>
    <ellipse cx="550" cy="420" rx="80" ry="35" fill="#78909C"/>

    <text x="550" y="455" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PostgreSQL</text>
    <text x="550" y="475" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Render DB)</text>
  </g>

  <!-- JSONL Storage -->
  <g filter="url(#shadow)">
    <rect x="470" y="550" width="160" height="60" rx="5" fill="#78909C"/>
    <text x="550" y="575" font-family="Arial" font-size="11" fill="white" text-anchor="middle">JSONL Files</text>
    <text x="550" y="595" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">(Fallback Storage)</text>
  </g>

  <!-- Connections -->
  <!-- Mobile to API -->
  <line x1="250" y1="530" x2="350" y2="220" stroke="#1976D2" stroke-width="2"/>
  <rect x="270" y="350" width="80" height="40" rx="3" fill="white" stroke="#1976D2" stroke-width="1"/>
  <text x="310" y="368" font-family="Arial" font-size="9" fill="#1976D2" text-anchor="middle">HTTPS</text>
  <text x="310" y="382" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">REST API</text>

  <!-- API to Database -->
  <line x1="550" y1="270" x2="550" y2="385" stroke="#607D8B" stroke-width="2"/>
  <rect x="510" y="310" width="80" height="30" rx="3" fill="white" stroke="#607D8B" stroke-width="1"/>
  <text x="550" y="330" font-family="Arial" font-size="9" fill="#607D8B" text-anchor="middle">SQLAlchemy</text>

  <!-- Database to JSONL -->
  <line x1="550" y1="525" x2="550" y2="550" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="600" y="540" font-family="Arial" font-size="8" fill="#666">fallback</text>

  <!-- API to External APIs -->
  <line x1="750" y1="220" x2="820" y2="450" stroke="#E65100" stroke-width="2"/>
  <rect x="760" y="310" width="70" height="30" rx="3" fill="white" stroke="#E65100" stroke-width="1"/>
  <text x="795" y="330" font-family="Arial" font-size="9" fill="#E65100" text-anchor="middle">HTTPS</text>

  <!-- Legend -->
  <rect x="50" y="60" width="200" height="100" rx="5" fill="white" stroke="#ddd" filter="url(#shadow)"/>
  <text x="150" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">Leyenda</text>

  <rect x="70" y="100" width="30" height="20" rx="3" fill="url(#serverGrad)"/>
  <text x="115" y="115" font-family="Arial" font-size="9" fill="#333">Servidor</text>

  <rect x="70" y="130" width="30" height="20" rx="5" fill="url(#deviceGrad)"/>
  <text x="115" y="145" font-family="Arial" font-size="9" fill="#333">Dispositivo</text>

  <ellipse cx="85" cy="168" rx="15" ry="8" fill="#607D8B"/>
  <text x="115" y="172" font-family="Arial" font-size="9" fill="#333">Base de Datos</text>

  <!-- Protocol Labels -->
  <text x="850" y="640" font-family="Arial" font-size="10" fill="#333">Protocolos: HTTPS, REST, SQL</text>
  <text x="850" y="660" font-family="Arial" font-size="10" fill="#333">Puertos: 443 (HTTPS), 5432 (PostgreSQL)</text>

  <!-- Version -->
  <text x="1050" y="730" font-family="Arial" font-size="9" fill="#999" text-anchor="end">ALERTA-LINK v1.2.0</text>
</svg>
