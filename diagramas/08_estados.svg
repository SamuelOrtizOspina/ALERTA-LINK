<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">ALERTA-LINK - Diagrama de Estados: Ciclo de Analisis de URL</text>

  <!-- Initial State -->
  <circle cx="500" cy="80" r="15" fill="#333" filter="url(#shadow)"/>

  <!-- State: Idle (Esperando Input) -->
  <g filter="url(#shadow)">
    <rect x="400" y="120" width="200" height="60" rx="30" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="500" y="155" font-family="Arial" font-size="13" font-weight="bold" fill="#1976D2" text-anchor="middle">IDLE</text>
    <text x="500" y="170" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Esperando Input</text>
  </g>
  <line x1="500" y1="95" x2="500" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- State: Validating URL -->
  <g filter="url(#shadow)">
    <rect x="400" y="220" width="200" height="60" rx="30" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="500" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#E65100" text-anchor="middle">VALIDATING</text>
    <text x="500" y="270" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Validando URL</text>
  </g>
  <line x1="500" y1="180" x2="500" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="205" font-family="Arial" font-size="9" fill="#666">URL recibida</text>

  <!-- State: Error (Invalid URL) -->
  <g filter="url(#shadow)">
    <rect x="680" y="220" width="150" height="60" rx="30" fill="#FFEBEE" stroke="#c62828" stroke-width="2"/>
    <text x="755" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">ERROR</text>
    <text x="755" y="270" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">URL Invalida</text>
  </g>
  <line x1="600" y1="250" x2="680" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="240" font-family="Arial" font-size="9" fill="#c62828">[URL invalida]</text>

  <!-- Return from Error to Idle -->
  <path d="M 755 280 L 755 320 L 200 320 L 200 150 L 400 150" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="310" font-family="Arial" font-size="9" fill="#c62828">mostrar error / reset</text>

  <!-- State: Extracting Features -->
  <g filter="url(#shadow)">
    <rect x="400" y="320" width="200" height="60" rx="30" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
    <text x="500" y="350" font-family="Arial" font-size="13" font-weight="bold" fill="#388E3C" text-anchor="middle">EXTRACTING</text>
    <text x="500" y="368" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Extrayendo Features</text>
  </g>
  <line x1="500" y1="280" x2="500" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="305" font-family="Arial" font-size="9" fill="#388E3C">[URL valida]</text>

  <!-- Composite State: Analyzing -->
  <g filter="url(#shadow)">
    <rect x="100" y="420" width="800" height="180" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <rect x="100" y="420" width="800" height="30" rx="10" fill="#7B1FA2"/>
    <text x="500" y="442" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ANALYZING (Composite State)</text>
  </g>
  <line x1="500" y1="380" x2="500" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="405" font-family="Arial" font-size="9" fill="#666">features extraidas</text>

  <!-- Fork Bar -->
  <rect x="200" y="470" width="600" height="6" rx="3" fill="#333"/>
  <line x1="500" y1="450" x2="500" y2="470" stroke="#555" stroke-width="2"/>

  <!-- Parallel States inside Analyzing -->
  <!-- ML Prediction -->
  <g>
    <rect x="150" y="500" width="180" height="50" rx="25" fill="#CE93D8" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="240" y="530" font-family="Arial" font-size="11" fill="#4A148C" text-anchor="middle">ML Prediction</text>
  </g>
  <line x1="240" y1="476" x2="240" y2="500" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Heuristic Analysis -->
  <g>
    <rect x="410" y="500" width="180" height="50" rx="25" fill="#CE93D8" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="500" y="530" font-family="Arial" font-size="11" fill="#4A148C" text-anchor="middle">Heuristic Analysis</text>
  </g>
  <line x1="500" y1="476" x2="500" y2="500" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External API Check -->
  <g>
    <rect x="670" y="500" width="180" height="50" rx="25" fill="#FFCC80" stroke="#E65100" stroke-width="1.5"/>
    <text x="760" y="525" font-family="Arial" font-size="11" fill="#E65100" text-anchor="middle">External APIs</text>
    <text x="760" y="540" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">(Tranco, VT, WHOIS)</text>
  </g>
  <line x1="760" y1="476" x2="760" y2="500" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Join Bar -->
  <rect x="200" y="570" width="600" height="6" rx="3" fill="#333"/>
  <line x1="240" y1="550" x2="240" y2="570" stroke="#555" stroke-width="1.5"/>
  <line x1="500" y1="550" x2="500" y2="570" stroke="#555" stroke-width="1.5"/>
  <line x1="760" y1="550" x2="760" y2="570" stroke="#555" stroke-width="1.5"/>

  <!-- State: Calculating Score -->
  <g filter="url(#shadow)">
    <rect x="400" y="630" width="200" height="60" rx="30" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
    <text x="500" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#388E3C" text-anchor="middle">CALCULATING</text>
    <text x="500" y="678" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Calculando Score Final</text>
  </g>
  <line x1="500" y1="600" x2="500" y2="630" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="620" font-family="Arial" font-size="9" fill="#666">analisis completo</text>

  <!-- Decision: Risk Level -->
  <polygon points="500,720 560,760 500,800 440,760" fill="#FFC107" stroke="#FF8F00" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="758" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Risk?</text>
  <line x1="500" y1="690" x2="500" y2="720" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final States -->
  <!-- LOW Risk -->
  <g filter="url(#shadow)">
    <rect x="150" y="730" width="120" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="210" y="760" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">LOW</text>
    <text x="210" y="775" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">0-30</text>
  </g>
  <line x1="440" y1="760" x2="270" y2="760" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="750" font-family="Arial" font-size="9" fill="#4CAF50">[score 0-30]</text>

  <!-- MEDIUM Risk -->
  <g filter="url(#shadow)">
    <rect x="300" y="820" width="120" height="50" rx="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="360" y="850" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">MEDIUM</text>
    <text x="360" y="865" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">31-70</text>
  </g>
  <line x1="480" y1="800" x2="400" y2="830" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="810" font-family="Arial" font-size="9" fill="#FF9800">[score 31-70]</text>

  <!-- HIGH Risk -->
  <g filter="url(#shadow)">
    <rect x="580" y="820" width="120" height="50" rx="25" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <text x="640" y="850" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HIGH</text>
    <text x="640" y="865" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">71-100</text>
  </g>
  <line x1="520" y1="800" x2="600" y2="830" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="810" font-family="Arial" font-size="9" fill="#f44336">[score 71-100]</text>

  <!-- Return to Idle from Results -->
  <path d="M 150 755 L 80 755 L 80 150 L 400 150" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <path d="M 360 870 L 60 870 L 60 150 L 100 150" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 700 855 L 920 855 L 920 150 L 600 150" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="940" y="500" font-family="Arial" font-size="9" fill="#666" transform="rotate(90, 940, 500)">nueva URL / reset</text>

  <!-- Legend -->
  <rect x="750" y="60" width="220" height="140" rx="5" fill="white" stroke="#ddd" filter="url(#shadow)"/>
  <text x="860" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">Leyenda</text>

  <circle cx="775" cy="105" r="8" fill="#333"/>
  <text x="800" y="110" font-family="Arial" font-size="9" fill="#333">Estado Inicial</text>

  <rect x="765" y="120" width="40" height="20" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="825" y="135" font-family="Arial" font-size="9" fill="#333">Estado Simple</text>

  <rect x="765" y="150" width="40" height="20" rx="5" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="825" y="165" font-family="Arial" font-size="9" fill="#333">Estado Compuesto</text>

  <polygon points="785,190 795,180 805,190 795,200" fill="#FFC107" stroke="#FF8F00" stroke-width="1"/>
  <text x="825" y="195" font-family="Arial" font-size="9" fill="#333">Decision</text>
</svg>
