<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5B8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f5f7fa"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">ALERTA-LINK - Arquitectura del Sistema</text>

  <!-- Usuario (Actor) -->
  <g transform="translate(80, 120)">
    <circle cx="30" cy="20" r="18" fill="#555"/>
    <line x1="30" y1="38" x2="30" y2="70" stroke="#555" stroke-width="3"/>
    <line x1="30" y1="50" x2="10" y2="65" stroke="#555" stroke-width="3"/>
    <line x1="30" y1="50" x2="50" y2="65" stroke="#555" stroke-width="3"/>
    <line x1="30" y1="70" x2="15" y2="100" stroke="#555" stroke-width="3"/>
    <line x1="30" y1="70" x2="45" y2="100" stroke="#555" stroke-width="3"/>
    <text x="30" y="120" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Usuario</text>
    <text x="30" y="135" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(Celular Android)</text>
  </g>

  <!-- App Movil Flutter -->
  <g filter="url(#shadow)">
    <rect x="180" y="100" width="180" height="160" rx="10" fill="url(#blueGrad)"/>
    <text x="270" y="130" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">APP MOVIL</text>
    <text x="270" y="150" font-family="Arial" font-size="12" fill="white" text-anchor="middle">(Flutter/Android)</text>
    <line x1="200" y1="165" x2="340" y2="165" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="270" y="185" font-family="Arial" font-size="10" fill="white" text-anchor="middle">- Input URL</text>
    <text x="270" y="200" font-family="Arial" font-size="10" fill="white" text-anchor="middle">- Semaforo Visual</text>
    <text x="270" y="215" font-family="Arial" font-size="10" fill="white" text-anchor="middle">- Senales Detectadas</text>
    <text x="270" y="230" font-family="Arial" font-size="10" fill="white" text-anchor="middle">- Historial</text>
    <text x="270" y="245" font-family="Arial" font-size="10" fill="white" text-anchor="middle">- Share Intent</text>
  </g>

  <!-- Arrow Usuario -> App -->
  <path d="M 140 180 L 175 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Backend FastAPI -->
  <g filter="url(#shadow)">
    <rect x="450" y="80" width="200" height="200" rx="10" fill="url(#greenGrad)"/>
    <text x="550" y="110" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">BACKEND API</text>
    <text x="550" y="130" font-family="Arial" font-size="12" fill="white" text-anchor="middle">(FastAPI/Python)</text>
    <line x1="470" y1="145" x2="630" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="550" y="165" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Endpoints:</text>
    <text x="550" y="180" font-family="Arial" font-size="9" fill="white" text-anchor="middle">POST /analyze</text>
    <text x="550" y="195" font-family="Arial" font-size="9" fill="white" text-anchor="middle">GET /health</text>
    <text x="550" y="210" font-family="Arial" font-size="9" fill="white" text-anchor="middle">GET /whois/{domain}</text>
    <text x="550" y="225" font-family="Arial" font-size="9" fill="white" text-anchor="middle">POST /report</text>
    <text x="550" y="240" font-family="Arial" font-size="9" fill="white" text-anchor="middle">POST /ingest</text>
    <text x="550" y="260" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">api.samuelortizospina.me</text>
  </g>

  <!-- Arrow App -> Backend -->
  <path d="M 360 160 L 445 160" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="402" y="150" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">POST /analyze</text>
  <path d="M 445 200 L 360 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="402" y="215" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">{score, risk, signals}</text>

  <!-- Motores de Deteccion -->
  <g filter="url(#shadow)">
    <rect x="720" y="80" width="150" height="90" rx="8" fill="url(#purpleGrad)"/>
    <text x="795" y="105" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Motor ML</text>
    <text x="795" y="125" font-family="Arial" font-size="9" fill="white" text-anchor="middle">GradientBoosting</text>
    <text x="795" y="140" font-family="Arial" font-size="9" fill="white" text-anchor="middle">97.5% Accuracy</text>
    <text x="795" y="155" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">step1_baseline.pkl</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="190" width="150" height="90" rx="8" fill="url(#purpleGrad)"/>
    <text x="795" y="215" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Motor Heuristico</text>
    <text x="795" y="235" font-family="Arial" font-size="9" fill="white" text-anchor="middle">16+ Senales</text>
    <text x="795" y="250" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Pesos Calibrados</text>
    <text x="795" y="265" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">heuristic_weights.json</text>
  </g>

  <!-- Arrows Backend -> Motores -->
  <path d="M 650 130 L 715 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 650 230 L 715 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- APIs Externas -->
  <g filter="url(#shadow)">
    <rect x="180" y="350" width="140" height="80" rx="8" fill="url(#orangeGrad)"/>
    <text x="250" y="380" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Tranco API</text>
    <text x="250" y="400" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Top 1M Dominios</text>
    <text x="250" y="415" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">tranco-list.eu</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="350" width="140" height="80" rx="8" fill="url(#orangeGrad)"/>
    <text x="420" y="380" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">VirusTotal API</text>
    <text x="420" y="400" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Threat Intelligence</text>
    <text x="420" y="415" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">virustotal.com</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="350" width="140" height="80" rx="8" fill="url(#orangeGrad)"/>
    <text x="590" y="380" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">WHOIS</text>
    <text x="590" y="400" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Edad del Dominio</text>
    <text x="590" y="415" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">python-whois</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="350" width="140" height="80" rx="8" fill="url(#orangeGrad)"/>
    <text x="760" y="380" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Crawler</text>
    <text x="760" y="400" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Analisis Profundo</text>
    <text x="760" y="415" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">Playwright/Chromium</text>
  </g>

  <!-- Arrows Backend -> APIs -->
  <path d="M 500 280 L 500 310 L 250 310 L 250 345" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 530 280 L 530 310 L 420 310 L 420 345" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 560 280 L 560 310 L 590 310 L 590 345" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 590 280 L 590 310 L 760 310 L 760 345" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Base de Datos -->
  <g filter="url(#shadow)">
    <ellipse cx="250" cy="520" rx="70" ry="25" fill="#607D8B"/>
    <rect x="180" y="520" width="140" height="50" fill="#607D8B"/>
    <ellipse cx="250" cy="570" rx="70" ry="25" fill="#455A64"/>
    <text x="250" y="550" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PostgreSQL</text>
    <text x="250" y="600" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">(Opcional)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="495" width="120" height="80" rx="5" fill="#78909C"/>
    <text x="460" y="525" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">JSONL</text>
    <text x="460" y="545" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Fallback Storage</text>
    <text x="460" y="560" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">ingested_urls.jsonl</text>
  </g>

  <!-- Arrow Backend -> DB -->
  <path d="M 480 280 L 480 340 L 350 340 L 350 495" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Dataset -->
  <g filter="url(#shadow)">
    <rect x="600" y="495" width="140" height="80" rx="8" fill="#795548"/>
    <text x="670" y="520" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Dataset</text>
    <text x="670" y="540" font-family="Arial" font-size="9" fill="white" text-anchor="middle">6,000 URLs</text>
    <text x="670" y="555" font-family="Arial" font-size="9" fill="white" text-anchor="middle">Train/Val/Test</text>
    <text x="670" y="570" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">datasets/splits/</text>
  </g>

  <!-- Arrow Dataset -> ML -->
  <path d="M 740 535 L 850 535 L 850 280 L 795 280" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="870" y="400" font-family="Arial" font-size="8" fill="#666" transform="rotate(-90, 870, 400)">Entrenamiento</text>

  <!-- Legend -->
  <rect x="30" y="620" width="940" height="60" rx="5" fill="white" stroke="#ddd"/>
  <text x="50" y="645" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Leyenda:</text>
  <rect x="120" y="635" width="20" height="15" fill="url(#blueGrad)"/>
  <text x="145" y="647" font-family="Arial" font-size="10" fill="#333">Frontend</text>
  <rect x="210" y="635" width="20" height="15" fill="url(#greenGrad)"/>
  <text x="235" y="647" font-family="Arial" font-size="10" fill="#333">Backend</text>
  <rect x="300" y="635" width="20" height="15" fill="url(#purpleGrad)"/>
  <text x="325" y="647" font-family="Arial" font-size="10" fill="#333">ML/IA</text>
  <rect x="380" y="635" width="20" height="15" fill="url(#orangeGrad)"/>
  <text x="405" y="647" font-family="Arial" font-size="10" fill="#333">APIs Externas</text>
  <rect x="500" y="635" width="20" height="15" fill="#607D8B"/>
  <text x="525" y="647" font-family="Arial" font-size="10" fill="#333">Base de Datos</text>
  <rect x="620" y="635" width="20" height="15" fill="#795548"/>
  <text x="645" y="647" font-family="Arial" font-size="10" fill="#333">Datasets</text>

  <!-- Version -->
  <text x="970" y="680" font-family="Arial" font-size="9" fill="#999" text-anchor="end">ALERTA-LINK v1.2.0 - Universidad Manuela Beltran 2026</text>
</svg>
